name: Force Pages rebuild
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/force-pages-rebuild.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump index.html for Pages
        run: |
          set -euo pipefail
          test "$(wc -c < index.html)" -gt 30000
          grep -q '65c4b5fc74cd890a8a2a6ca74d704353' index.html
          grep -q 'id="orderForm"' index.html
          ! grep -q 'FILE_CONTENT_FROM_' index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          assert '65c4b5fc74cd890a8a2a6ca74d704353' in t
          assert 'orderForm' in t
          if '<!-- pages-rebuild -->' not in t:
              t = t.replace('</head>', '  <!-- pages-rebuild -->\n</head>', 1)
              p.write_text(t)
          print('bytes', len(t.encode()))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "already bumped" && exit 0
          git commit -m "Force GitHub Pages rebuild"
          git push
