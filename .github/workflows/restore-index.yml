name: Restore index.html
on:
  workflow_dispatch:
  push:
    paths:
      - '_restore/**'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble index.html from parts
        run: |
          set -euo pipefail
          cat _restore/part.* > index.html
          wc -c index.html
          grep -q '65c4b5fc74cd890a8a2a6ca74d704353' index.html
          grep -q 'id="orderForm"' index.html
          ! grep -q 'formsubmit.co/ajax/justin@tuenproductions.com' index.html
          ! grep -q 'document.write' index.html
          test "$(wc -c < index.html)" -gt 30000
      - name: Commit restored index.html
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Restore full order page with FormSubmit form hash"
          git push
